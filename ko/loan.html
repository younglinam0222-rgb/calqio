<script>
function switchLang(l){var p=location.pathname.split('/').pop()||'index.html';location.href='/'+l+'/'+p;}
function toggleMenu(){document.getElementById('lBtn').classList.toggle('open');document.getElementById('lDrop').classList.toggle('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.lw')){var b=document.getElementById('lBtn');var d=document.getElementById('lDrop');if(b)b.classList.remove('open');if(d)d.classList.remove('open');}});
</script>
<script>
var lM=0,dChart=null;
var DESCS=["매달 동일한 금액(원금+이자)을 상환합니다. 계획적인 자금 운용에 적합합니다.","매달 원금은 동일하게, 이자는 줄어들어 월 납입금이 점점 감소합니다. 총 이자가 가장 적습니다.","기간 동안 이자만 납부하다 만기에 원금 전액 상환. 전세자금대출 등에 사용됩니다."];
function fmtV(n){if(n>=100000000)return(n/100000000).toFixed(2)+'억원';if(n>=10000)return Math.round(n/10000)+'만원';return Math.round(n).toLocaleString()+'원';}
function setM(m){
  lM=m;
  [0,1,2].forEach(function(i){
    var b=document.getElementById('lm'+i);
    b.style.background=i===m?'var(--accent)':'transparent';
    b.style.color=i===m?'#fff':'var(--text-sub)';
  });
  document.getElementById('mDesc').textContent=DESCS[m];
  calcL();
}
function addL(v){var e=document.getElementById('loan');e.value=Math.max(0,(+e.value||0)+v);calcL();}
function addR(v){var e=document.getElementById('lrate');e.value=Math.max(0,(+e.value||0)+v).toFixed(1);calcL();}
function addT(v){var e=document.getElementById('lterm');e.value=Math.max(1,+e.value+v);calcL();}
function calcL(){
  var L=+document.getElementById('loan').value||0;
  var ir=+document.getElementById('lrate').value/100/12||0;
  var n=+document.getElementById('lterm').value*12||0;
  if(!L||!ir||!n)return;
  var mp=0,totalInt=0,rows=[];
  if(lM===0){
    mp=L*ir*Math.pow(1+ir,n)/(Math.pow(1+ir,n)-1);
    totalInt=mp*n-L;
    var bal=L;
    for(var y=1;y<=n/12;y++){
      var yP=0,yI=0;
      for(var mm=1;mm<=12;mm++){var i=bal*ir;yP+=mp-i;yI+=i;bal-=mp-i;}
      rows.push({y:y,mp:Math.round(mp),p:Math.round(yP),i:Math.round(yI),b:Math.max(0,Math.round(bal))});
    }
  }else if(lM===1){
    var pM=L/n;var bal2=L;
    for(var y2=1;y2<=n/12;y2++){
      var yP2=0,yI2=0,fMp=0;
      for(var mm2=1;mm2<=12;mm2++){var i2=bal2*ir;if(!fMp)fMp=pM+i2;yP2+=pM;yI2+=i2;totalInt+=i2;bal2-=pM;}
      rows.push({y:y2,mp:Math.round(fMp),p:Math.round(yP2),i:Math.round(yI2),b:Math.max(0,Math.round(bal2))});
    }
    mp=L/n+L*ir;
  }else{
    mp=L*ir;totalInt=mp*n;
    for(var y3=1;y3<=n/12;y3++){
      rows.push({y:y3,mp:Math.round(mp),p:y3===n/12?L:0,i:Math.round(mp*12),b:y3===n/12?0:L});
    }
  }
  var tot=L+totalInt;
  document.getElementById('rcVal').textContent=fmtV(mp);
  document.getElementById('rcTot').textContent=fmtV(tot);
  document.getElementById('rcInt').textContent=fmtV(totalInt);
  var ratio=totalInt/tot*100;
  document.getElementById('rcRatio').textContent=ratio.toFixed(1)+'%';
  document.getElementById('rcCnt').textContent=n;
  document.getElementById('dPct').textContent=ratio.toFixed(1)+'%';
  var isDark=!document.body.classList.contains('light-mode');
  if(dChart)dChart.destroy();
  var ctx=document.getElementById('donutC').getContext('2d');
  dChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels:['원금','이자'],datasets:[{data:[L,totalInt],backgroundColor:['#5b7fee','#ef4444'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:true,cutout:'65%',
      plugins:{legend:{position:'bottom',labels:{color:isDark?'#8888a0':'#555',font:{size:10},boxWidth:10,padding:6}},
        tooltip:{callbacks:{label:function(c){return ' '+c.label+': '+fmtV(c.parsed);}}}}}
  });
  document.getElementById('sTbl').innerHTML=rows.map(function(r){
    return '<tr><td style="text-align:center;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text-muted)">'+r.y+'</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text-sub)">'+fmtV(r.mp)+'</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text-sub)">'+fmtV(r.p)+'</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--neg)">'+fmtV(r.i)+'</td><td style="text-align:right;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text-sub)">'+fmtV(r.b)+'</td></tr>';
  }).join('');
}
calcL();

document.addEventListener("DOMContentLoaded",function(){try{calcL();}catch(e){}});
</script>
