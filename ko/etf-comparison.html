<div style="max-width:860px;margin:0 auto;padding:24px 18px 14px;text-align:center">
  <h1 style="font-size:clamp(20px,3.5vw,28px);font-weight:800;letter-spacing:-1px;margin-bottom:7px">
    ETF 수익 비교<br><em style="color:var(--accent);font-style:normal">10년 시뮬레이션</em>
  </h1>
  <p style="color:var(--text-sub);font-size:13px">투자금액을 입력하면 주요 ETF의 자산 성장을 실시간으로 비교합니다.</p>

<div style="max-width:860px;margin:0 auto;padding:0 18px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
      <div style="flex:1;min-width:130px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">💰 투자 원금</div>
        <input type="number" id="initA" value="100000000" oninput="updateETF()" style="width:100%;padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;font-family:'DM Mono',monospace">
        <div class="qbtns"><button class="qb" onclick="setAmt(10000000)">1천만</button><button class="qb" onclick="setAmt(50000000)">5천만</button><button class="qb" onclick="setAmt(100000000)">1억</button><button class="qb" onclick="setAmt(500000000)">5억</button></div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">📅 투자 시작 연도</div>
        <select id="sYear" onchange="updateETF()" style="padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:inherit">
          <option value="2015">2015</option><option value="2018">2018</option>
          <option value="2020">2020</option><option value="2022">2022</option>
        </select>
      </div>
      <div>
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">🔄 배당금 처리</div>
        <div style="display:flex;gap:4px">
          <div id="rt0" onclick="setRe(true)" style="padding:7px 12px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer">재투자</div>
          <div id="rt1" onclick="setRe(false)" style="padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text-sub);font-size:12px;font-weight:600;cursor:pointer">수령</div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px" id="etfChips"></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px" id="etfCards"></div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px">

<script>
function switchLang(l){var p=location.pathname.split('/').pop()||'index.html';location.href='/'+l+'/'+p;}
function toggleMenu(){document.getElementById('lBtn').classList.toggle('open');document.getElementById('lDrop').classList.toggle('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.lw')){var b=document.getElementById('lBtn');var d=document.getElementById('lDrop');if(b)b.classList.remove('open');if(d)d.classList.remove('open');}});
</script>
<script>
var ETF_DATA={
  QQQ:{name:"QQQ",desc:"NASDAQ-100",color:"#5b7fee",r:{2015:[100,107,133,128,183,261,346,233,324,440],2018:[100,71,118,157,210,141,197,264,270],2020:[100,131,174,117,163,221,226],2022:[100,152,155,211,216]}},
  TQQQ:{name:"TQQQ",desc:"QQQ 3x",color:"#ef4444",r:{2015:[100,108,195,128,317,698,1198,396,896,1600],2018:[100,39,87,179,258,89,202,362,370],2020:[100,185,286,96,151,223,228],2022:[100,211,215,293,300]}},
  SCHD:{name:"SCHD",desc:"Dividend Growth",color:"#22c55e",r:{2015:[100,116,134,124,156,166,207,200,203,181],2018:[100,80,104,131,133,133,134,119],2020:[100,126,127,128,114,115],2022:[100,101,90,91,91]}},
  VOO:{name:"VOO",desc:"S&P 500",color:"#f59e0b",r:{2015:[100,112,137,130,171,201,261,214,271,289],2018:[100,76,100,133,157,125,158,211,216],2020:[100,128,161,128,162,207,211],2022:[100,127,130,177,180]}}
};
function fmtV(n){if(n>=100000000)return(n/100000000).toFixed(2)+'억원';if(n>=10000)return Math.round(n/10000)+'만원';return Math.round(n).toLocaleString()+'원';}
var reinvest=true,selETFs=["QQQ","TQQQ","SCHD","VOO"],etfChart=null;
function setRe(v){
  reinvest=v;
  document.getElementById('rt0').style.background=v?'var(--accent)':'var(--bg2)';
  document.getElementById('rt0').style.color=v?'#fff':'var(--text-sub)';
  document.getElementById('rt0').style.borderColor=v?'var(--accent)':'var(--border)';
  document.getElementById('rt1').style.background=!v?'var(--accent)':'var(--bg2)';
  document.getElementById('rt1').style.color=!v?'#fff':'var(--text-sub)';
  document.getElementById('rt1').style.borderColor=!v?'var(--accent)':'var(--border)';
  updateETF();
}
function setAmt(v){document.getElementById('initA').value=v;updateETF();}
function renderChips(){
  document.getElementById('etfChips').innerHTML=Object.keys(ETF_DATA).map(function(k){
    var e=ETF_DATA[k];var on=selETFs.indexOf(k)>=0;
    var chip='<label style="display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:16px;border:1.5px solid '+(on?e.color:'var(--border)')+';background:'+(on?e.color:'var(--bg2)')+';cursor:pointer;font-size:11px;font-weight:600;color:'+(on?'#fff':'var(--text-sub)')+'">';
    chip+='<input type="checkbox" style="display:none" '+(on?'checked':'')+' onchange="toggleE(this.dataset.k,this)" data-k="'+k+'">';
    chip+='<span style="width:7px;height:7px;border-radius:50%;background:'+e.color+';flex-shrink:0"></span>'+k+'</label>';
    return chip;
  }).join('');
}
function toggleE(k,cb){
  if(cb.checked){if(selETFs.indexOf(k)<0)selETFs.push(k);}
  else selETFs=selETFs.filter(function(x){return x!==k;});
  renderChips();updateETF();
}
function updateETF(){
  var init=+document.getElementById('initA').value||100000000;
  var sy=document.getElementById('sYear').value;
  var datasets=[],cards=[];
  selETFs.forEach(function(k){
    var e=ETF_DATA[k];if(!e)return;
    var raw=e.r[sy]||e.r['2015']||[];
    var data=raw.map(function(v){return Math.round(init*v/100);});
    datasets.push({label:k,data:data,borderColor:e.color,backgroundColor:e.color+'15',fill:false,tension:0.4,borderWidth:2.5,pointRadius:3});
    var final=data[data.length-1];
    var rate=((final-init)/init*100).toFixed(0);
    cards.push('<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid '+e.color+';border-radius:var(--radius);padding:14px"><div style="font-size:11px;font-weight:700;color:var(--text-sub)">'+k+'</div><div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">'+e.desc+'</div><div style="font-size:18px;font-weight:800;font-family:'DM Mono',monospace;color:'+e.color+'">'+fmtV(final)+'</div><div style="font-size:12px;font-weight:700;color:'+(final>=init?'var(--pos)':'var(--neg)')+'">'+((final>=init?'+':'')+rate)+'%</div></div>');
  });
  document.getElementById('etfCards').innerHTML=cards.join('');
  var raw0=(ETF_DATA[selETFs[0]]||{r:{}}).r[sy]||(ETF_DATA[selETFs[0]]||{r:{}}).r['2015']||[];
  var labels=raw0.map(function(_,i){return +sy+i+'';}); 
  var isDark=!document.body.classList.contains('light-mode');
  if(etfChart)etfChart.destroy();
  etfChart=new Chart(document.getElementById('etfChart').getContext('2d'),{
    type:'line',data:{labels:labels,datasets:datasets},
    options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:isDark?'#8888a0':'#555',font:{size:11}}},
        tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmtV(c.parsed.y);}}}
      },
      scales:{
        x:{ticks:{color:isDark?'#8888a0':'#555',font:{size:10}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}},
        y:{ticks:{color:isDark?'#8888a0':'#555',font:{size:10}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}}
      }
    }
  });
}
renderChips();updateETF();
</script>
</body>
