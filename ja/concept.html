<div style="max-width:860px;margin:0 auto;padding:24px 18px 14px;text-align:center">
  <h1 style="font-size:clamp(20px,3.5vw,28px);font-weight:800;letter-spacing:-1px;margin-bottom:7px">
    複利の概念を完全理解<br><em style="color:var(--accent);font-style:normal">72の法則から月次複利まで</em>
  </h1>
  <p style="color:var(--text-sub);font-size:13px">実際に入力して複利の原理を体感してください。</p>

<div style="max-width:860px;margin:0 auto;padding:0 18px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">✕2 72の法則 — 元本が2倍になる期間</div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <span style="font-size:13px;color:var(--text-sub);font-weight:600">72 ÷</span>
      <input type="number" id="r72r" value="8" step="0.5" oninput="calcR72()" style="width:80px;padding:8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;font-weight:700;text-align:center;outline:none;font-family:'DM Mono',monospace">
      <span style="font-size:13px;color:var(--text-sub);font-weight:600">% =</span>
      <div>
        <div style="font-size:40px;font-weight:900;color:var(--accent);font-family:'DM Mono',monospace;line-height:1" id="r72y">9</div>
        <div style="font-size:11px;color:var(--text-sub);margin-top:2px">年後に2倍</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px" id="r72cards"></div>
  </div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">🔄 複利計算頻度の比較</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div style="flex:1;min-width:110px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">元本</div>
        <input type="number" id="fP" value="1000000" oninput="calcFreq()" style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:'DM Mono',monospace">
      </div>
      <div style="flex:1;min-width:80px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">年利率 %</div>
        <input type="number" id="fR" value="8" step="0.5" oninput="calcFreq()" style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:'DM Mono',monospace">
      </div>
      <div style="flex:1;min-width:70px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">運用期間 (年)</div>
        <input type="number" id="fY" value="20" oninput="calcFreq()" style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none;font-family:'DM Mono',monospace">
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-bottom:12px" id="freqGrid"></div>
    <canvas id="freqC" height="180"></canvas>
  </div>

<script>
function switchLang(l){var p=location.pathname.split('/').pop()||'index.html';location.href='/'+l+'/'+p;}
function toggleMenu(){document.getElementById('lBtn').classList.toggle('open');document.getElementById('lDrop').classList.toggle('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.lw')){var b=document.getElementById('lBtn');var d=document.getElementById('lDrop');if(b)b.classList.remove('open');if(d)d.classList.remove('open');}});
</script>
<script>
var freqChart=null;
var FREQ_LBLS=['年複利', '半年複利', '四半期複利', '月複利', '週複利', '日複利'];
var FREQS=[1,2,4,12,52,365];
function fmtV(n){if(n>=100000000)return '¥'+(n/100000000).toFixed(2)+'億';if(n>=10000)return '¥'+Math.round(n/10000)+'万';return '¥'+Math.round(n).toLocaleString();}
function calcR72(){
  var r=+document.getElementById('r72r').value||1;
  document.getElementById('r72y').textContent=(72/r).toFixed(1);
  var rates=[3,4,5,6,7,8,9,10,12,15,20,25];
  document.getElementById('r72cards').innerHTML=rates.map(function(x){
    var active=Math.abs(x-r)<0.3;
    return '<div style="background:var(--bg2);border:1px solid '+(active?'var(--accent)':'var(--border)')+';border-radius:6px;padding:9px;text-align:center;cursor:pointer" onclick="document.getElementById('r72r').value='+x+';calcR72()">'
      +'<div style="font-size:15px;font-weight:800;color:var(--accent);font-family:'DM Mono',monospace">'+x+'%</div>'
      +'<div style="font-size:11px;color:var(--text-sub);margin-top:2px">'+(72/x).toFixed(1)+'</div>'
      +'</div>';
  }).join('');
}
function calcFreq(){
  var P=+document.getElementById('fP').value||0;
  var r=+document.getElementById('fR').value/100||0;
  var y=+document.getElementById('fY').value||0;
  if(!P||!r||!y)return;
  var results=FREQS.map(function(n,i){
    return {n:n,lbl:FREQ_LBLS[i],A:P*Math.pow(1+r/n,n*y),ear:Math.pow(1+r/n,n)-1};
  });
  var maxA=Math.max.apply(null,results.map(function(x){return x.A;}));
  document.getElementById('freqGrid').innerHTML=results.map(function(f){
    return '<div style="background:var(--bg2);border:1px solid '+(f.A===maxA?'var(--accent)':'var(--border)')+';border-radius:6px;padding:10px;text-align:center">'
      +'<div style="font-size:11px;color:var(--text-sub);margin-bottom:4px">'+f.lbl+'</div>'
      +'<div style="font-size:14px;font-weight:800;font-family:'DM Mono',monospace;color:'+(f.A===maxA?'var(--accent)':'var(--text)')+'">'+fmtV(f.A)+'</div>'
      +'<div style="font-size:10px;color:var(--accent);margin-top:2px;font-weight:600">'+(f.ear*100).toFixed(3)+'%</div>'
      +'</div>';
  }).join('');
  var labels=[];
  for(var i=1;i<=y;i+=Math.max(1,Math.ceil(y/20)))labels.push(i);
  var colors=['#f59e0b','#22c55e','#5b7fee','#ef4444'];
  var datasets=FREQS.slice(0,4).map(function(n,i){
    return {label:FREQ_LBLS[i],data:labels.map(function(tt){return Math.round(P*Math.pow(1+r/n,n*tt));}),
      borderColor:colors[i],fill:false,tension:0.3,borderWidth:2,pointRadius:1};
  });
  var isDark=!document.body.classList.contains('light-mode');
  if(freqChart)freqChart.destroy();
  freqChart=new Chart(document.getElementById('freqC').getContext('2d'),{
    type:'line',data:{labels:labels,datasets:datasets},
    options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:isDark?'#8888a0':'#555',font:{size:10}}},
        tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmtV(c.parsed.y);}}}
      },
      scales:{
        x:{ticks:{color:isDark?'#8888a0':'#555',font:{size:9}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}},
        y:{ticks:{color:isDark?'#8888a0':'#555',font:{size:9}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}}
      }
    }
  });
}
calcR72();calcFreq();
</script>
</body>
</html>
