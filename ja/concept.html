<body><nav>
  <a href="/ja/" class="logo">Calq<span>io</span></a>
  <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">🌙 ダーク</button>
  <div class="lw">
    <button class="lc" id="lBtn" onclick="toggleMenu()">
      <span class="fl">🇯🇵</span><span>日本語</span><span class="arr">▼</span>
    </button>
    <div class="ld" id="lDrop"><div class="lo" onclick="location.href='/ko/'"><span class="fl">🇰🇷</span>한국어</div><div class="lo" onclick="location.href='/en/'"><span class="fl">🇺🇸</span>English</div><div class="lo active" onclick="location.href='/ja/'"><span class="fl">🇯🇵</span>日本語</div><div class="lo" onclick="location.href='/zh/'"><span class="fl">🇨🇳</span>中文</div><div class="lo" onclick="location.href='/ar/'"><span class="fl">🇸🇦</span>العربية</div></div>
  </div>

<div style="max-width:860px;margin:0 auto;padding:24px 18px 14px;text-align:center">
  <h1 style="font-size:clamp(20px,3.5vw,30px);font-weight:800;letter-spacing:-1px;margin-bottom:8px">
    複利の概念を完全理解<br><em style="color:var(--accent);font-style:normal">72の法則から月次複利まで</em>
  </h1>
  <p style="color:var(--text-sub);font-size:13px">実際に入力して複利の原理を体感してください。</p>
</div>
<div style="max-width:860px;margin:0 auto;padding:0 18px 60px">

  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:14px">X2 72の法則 — 元本が2倍になる期間</div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
      <span style="font-size:14px;color:var(--text-sub);font-weight:600">72 ÷</span>
      <input type="number" id="r72in" value="8" step="0.5" oninput="calcR72()"
        style="width:80px;padding:9px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:18px;font-weight:700;text-align:center;outline:none;font-family:monospace">
      <span style="font-size:14px;color:var(--text-sub);font-weight:600">% =</span>
      <div>
        <div id="r72out" style="font-size:44px;font-weight:900;color:var(--accent);font-family:monospace;line-height:1">9</div>
        <div style="font-size:12px;color:var(--text-sub);margin-top:3px">年後に2倍</div>
      </div>
    </div>
    <div id="r72cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px"></div>
  </div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:14px">🔄 複利計算頻度の比較</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <div style="flex:1;min-width:100px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">元本</div>
        <input type="number" id="fP" value="1000000" oninput="calcFreq()"
          style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;font-family:monospace">
      </div>
      <div style="flex:1;min-width:80px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">年利率 %</div>
        <input type="number" id="fR" value="8" step="0.5" oninput="calcFreq()"
          style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;font-family:monospace">
      </div>
      <div style="flex:1;min-width:70px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">運用期間 (年)</div>
        <input type="number" id="fY" value="20" oninput="calcFreq()"
          style="width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:14px;outline:none;font-family:monospace">
      </div>
    </div>
    <div id="freqGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-bottom:14px"></div>
    <canvas id="freqChart" height="180"></canvas>
  </div>

</div>
<footer>
  <div>金融IQを高めよう — 8種類の金融計算ツール</div>

    <a href="/about.html">概要</a>

    <a href="/contact.html">お問い合わせ</a>
  </div>

<div id="toast"></div>
<script src="../common.js"></script>
<script>
function toggleMenu(){document.getElementById("lBtn").classList.toggle("open");document.getElementById("lDrop").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest(".lw")){var b=document.getElementById("lBtn");var d=document.getElementById("lDrop");if(b)b.classList.remove("open");if(d)d.classList.remove("open");}});
</script><script>
function fmtV(n){if(n>=100000000)return "¥"+(n/100000000).toFixed(2)+"億";if(n>=10000)return "¥"+Math.round(n/10000)+"万";return "¥"+Math.round(n).toLocaleString();}
var fChart=null;

/* 72의 법칙 */
function setR(x){ document.getElementById("r72in").value=x; calcR72(); }
function calcR72(){
  var r=+document.getElementById("r72in").value||1;
  document.getElementById("r72out").textContent=(72/r).toFixed(1);
  var rates=[3,4,5,6,7,8,9,10,12,15,20,25];
  var html="";
  rates.forEach(function(x){
    var active=Math.abs(x-r)<0.3;
    html+='<div onclick="setR('+x+')" style="';
    html+='background:var(--bg2);';
    html+='border:1px solid '+(active?"var(--accent)":"var(--border)")+';';
    html+='border-radius:6px;padding:9px;text-align:center;cursor:pointer">';
    html+='<div style="font-size:15px;font-weight:800;color:var(--accent);font-family:monospace">'+x+'%</div>';
    html+='<div style="font-size:11px;color:var(--text-sub);margin-top:2px">'+(72/x).toFixed(1)+'</div>';
    html+="</div>";
  });
  document.getElementById("r72cards").innerHTML=html;
}

/* 복리 주기 */
var FLBLS=["年複利", "半年複利", "四半期複利", "月複利", "週複利", "日複利"];
var FREQS=[1,2,4,12,52,365];
function calcFreq(){
  var P=+document.getElementById("fP").value||0;
  var r=+document.getElementById("fR").value/100||0;
  var y=+document.getElementById("fY").value||0;
  if(!P||!r||!y)return;
  var results=FREQS.map(function(n,i){
    return {n:n,lbl:FLBLS[i],A:P*Math.pow(1+r/n,n*y),ear:Math.pow(1+r/n,n)-1};
  });
  var maxA=Math.max.apply(null,results.map(function(x){return x.A;}));
  var html="";
  results.forEach(function(f){
    var best=f.A===maxA;
    html+='<div style="background:var(--bg2);border:1px solid '+(best?"var(--accent)":"var(--border)")+';border-radius:6px;padding:10px;text-align:center">';
    html+='<div style="font-size:11px;color:var(--text-sub);margin-bottom:4px">'+f.lbl+'</div>';
    html+='<div style="font-size:14px;font-weight:800;font-family:monospace;color:'+(best?"var(--accent)":"var(--text)")+'">'+fmtV(f.A)+'</div>';
    html+='<div style="font-size:10px;color:var(--accent);margin-top:2px;font-weight:600">'+(f.ear*100).toFixed(3)+'%</div>';
    html+="</div>";
  });
  document.getElementById("freqGrid").innerHTML=html;
  /* 차트 */
  var labels=[];
  for(var i=1;i<=y;i+=Math.max(1,Math.ceil(y/20))) labels.push(i);
  var colors=["#f59e0b","#22c55e","#5b7fee","#ef4444"];
  var datasets=FREQS.slice(0,4).map(function(n,i){
    return {
      label:FLBLS[i],
      data:labels.map(function(t){return Math.round(P*Math.pow(1+r/n,n*t));}),
      borderColor:colors[i],fill:false,tension:0.3,borderWidth:2,pointRadius:1
    };
  });
  var isDark=!document.body.classList.contains("light-mode");
  var tc=isDark?"#8888a0":"#555", gc=isDark?"rgba(255,255,255,0.04)":"rgba(0,0,0,0.04)";
  if(fChart) fChart.destroy();
  var ctx=document.getElementById("freqChart").getContext("2d");
  fChart=new Chart(ctx,{
    type:"line",
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{labels:{color:tc,font:{size:10}}},
        tooltip:{callbacks:{label:function(c){return " "+c.dataset.label+": "+fmtV(c.parsed.y);}}}
      },
      scales:{
        x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},
        y:{ticks:{color:tc,font:{size:9}},grid:{color:gc}}
      }
    }
  });
}
calcR72();
calcFreq();

</script>
</body>
</html>
