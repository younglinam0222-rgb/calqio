<script>
function switchLang(l){var p=location.pathname.split('/').pop()||'index.html';location.href='/'+l+'/'+p;}
function toggleMenu(){document.getElementById('lBtn').classList.toggle('open');document.getElementById('lDrop').classList.toggle('open');}
document.addEventListener('click',function(e){if(!e.target.closest('.lw')){var b=document.getElementById('lBtn');var d=document.getElementById('lDrop');if(b)b.classList.remove('open');if(d)d.classList.remove('open');}});
</script>
<script>
var svcChart=null;
function fmtV(n){if(n>=100000000)return '¥'+(n/100000000).toFixed(2)+'亿';if(n>=10000)return '¥'+Math.round(n/10000)+'万';return '¥'+Math.round(n).toLocaleString();}
function setPrin(v){document.getElementById('prin').value=v;calcSVC();}
function setRate(v){document.getElementById('rate').value=v;calcSVC();}
function setYrs(v){document.getElementById('yrs').value=v;calcSVC();}
function calcSVC(){
  var P=+document.getElementById('prin').value||0;
  var r=+document.getElementById('rate').value/100||0;
  var y=+document.getElementById('yrs').value||0;
  if(!P||!r||!y)return;
  var siF=P*(1+r*y),ciF=P*Math.pow(1+r,y);
  document.getElementById('siFin').textContent=fmtV(siF);
  document.getElementById('siI').textContent=fmtV(siF-P);
  document.getElementById('siR').textContent=((siF-P)/P*100).toFixed(1)+'%';
  document.getElementById('ciFin').textContent=fmtV(ciF);
  document.getElementById('ciI').textContent=fmtV(ciF-P);
  document.getElementById('ciR').textContent=((ciF-P)/P*100).toFixed(1)+'%';
  document.getElementById('diffA').textContent=fmtV(ciF-siF);
  document.getElementById('diffM').textContent=(ciF/P).toFixed(2)+'x';
  var labels=[],siD=[],ciD=[];
  var step=Math.max(1,Math.ceil(y/25));
  for(var i=1;i<=y;i+=step){labels.push(i);siD.push(Math.round(P*(1+r*i)));ciD.push(Math.round(P*Math.pow(1+r,i)));}
  var isDark=!document.body.classList.contains('light-mode');
  if(svcChart)svcChart.destroy();
  var ctx=document.getElementById('svcC').getContext('2d');
  svcChart=new Chart(ctx,{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'单利',data:siD,borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.07)',fill:true,tension:0.1,borderWidth:2,pointRadius:1},
      {label:'复利',data:ciD,borderColor:'#5b7fee',backgroundColor:'rgba(91,127,254,0.09)',fill:true,tension:0.4,borderWidth:2.5,pointRadius:1}
    ]},
    options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:isDark?'#8888a0':'#555',font:{size:11}}},
        tooltip:{callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmtV(c.parsed.y);}}}
      },
      scales:{
        x:{ticks:{color:isDark?'#8888a0':'#555',font:{size:10}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}},
        y:{ticks:{color:isDark?'#8888a0':'#555',font:{size:10}},grid:{color:isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}}
      }
    }
  });
}
calcSVC();
</script>
