<script>
function toggleMenu(){document.getElementById("lBtn").classList.toggle("open");document.getElementById("lDrop").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest(".lw")){var b=document.getElementById("lBtn"),d=document.getElementById("lDrop");if(b)b.classList.remove("open");if(d)d.classList.remove("open");}});

<script>
function fmtV(n){if(n>=100000000)return "¥"+(n/100000000).toFixed(2)+"亿";if(n>=10000)return "¥"+Math.round(n/10000)+"万";return "¥"+Math.round(n).toLocaleString();}
var FC = null;
var FLBLS = ["年复利","半年复利","季度复利","月复利","周复利","日复利"];
var FREQS = [1,2,4,12,52,365];
var R72S  = [3,4,5,6,7,8,9,10,12,15,20,25];

// 72의 법칙: data-r 속성으로 값 전달 → 문자열 없음
function pickR(btn) {
  document.getElementById("rIn").value = btn.dataset.r;
  doR72();
}

function doR72() {
  var r = parseFloat(document.getElementById("rIn").value) || 1;
  document.getElementById("rOut").textContent = (72/r).toFixed(1);
  var pieces = R72S.map(function(x) {
    var act = Math.abs(x - r) < 0.3;
    return "<button data-r=\"" + x + "\" onclick=\"pickR(this)\" "
         + "style=\"background:" + (act ? "rgba(91,127,254,.15)" : "var(--bg2)") + ";"
         + "border:1px solid " + (act ? "var(--accent)" : "var(--border)") + ";"
         + "border-radius:6px;padding:9px;text-align:center;cursor:pointer;"
         + "width:100%;font-family:inherit;\">"
         + "<div style=\"font-size:15px;font-weight:800;color:var(--accent);font-family:monospace\">" + x + "%</div>"
         + "<div style=\"font-size:11px;color:var(--text-sub);margin-top:2px\">" + (72/x).toFixed(1) + "</div>"
         + "</button>";
  });
  document.getElementById("rCards").innerHTML = pieces.join("");
}

function doFreq() {
  var P = parseFloat(document.getElementById("fP").value) || 0;
  var G = parseFloat(document.getElementById("fR").value) || 0;
  var Y = parseFloat(document.getElementById("fY").value) || 0;
  if (P <= 0 || G <= 0 || Y <= 0) return;
  var r = G / 100;
  var finals = FREQS.map(function(n) { return P * Math.pow(1 + r/n, n*Y); });
  var maxA   = Math.max.apply(null, finals);
  var cards  = FREQS.map(function(n, i) {
    var A   = finals[i];
    var ear = Math.pow(1 + r/n, n) - 1;
    var best= A === maxA;
    return "<div style=\"background:var(--bg2);border:1px solid " + (best ? "var(--accent)" : "var(--border)") + ";border-radius:6px;padding:10px;text-align:center;\">"
         + "<div style=\"font-size:11px;color:var(--text-sub);margin-bottom:4px\">" + FLBLS[i] + "</div>"
         + "<div style=\"font-size:14px;font-weight:800;font-family:monospace;color:" + (best ? "var(--accent)" : "var(--text)") + "\">" + fmtV(A) + "</div>"
         + "<div style=\"font-size:10px;color:var(--accent);margin-top:2px;font-weight:600\">" + (ear*100).toFixed(3) + "%</div>"
         + "</div>";
  });
  document.getElementById("fGrid").innerHTML = cards.join("");

  var step   = Math.max(1, Math.ceil(Y/20));
  var labels = [];
  for (var t = 1; t <= Y; t += step) labels.push(t);
  var colors  = ["#f59e0b","#22c55e","#5b7fee","#ef4444"];
  var datasets= FREQS.slice(0,4).map(function(n,i) {
    return {
      label: FLBLS[i],
      data:  labels.map(function(t) { return Math.round(P * Math.pow(1+r/n, n*t)); }),
      borderColor: colors[i], fill: false, tension: 0.3, borderWidth: 2, pointRadius: 1
    };
  });
  var isDark = !document.body.classList.contains("light-mode");
  var tc = isDark ? "#8888a0" : "#555";
  var gc = isDark ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.04)";
  if (FC) FC.destroy();
  FC = new Chart(document.getElementById("fChart").getContext("2d"), {
    type: "line",
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: tc, font: { size: 10 } } },
        tooltip: { callbacks: { label: function(c) { return " " + c.dataset.label + ": " + fmtV(c.parsed.y); } } }
      },
      scales: {
        x: { ticks: { color: tc, font: { size: 9 } }, grid: { color: gc } },
        y: { ticks: { color: tc, font: { size: 9 } }, grid: { color: gc } }
      }
    }
  });
}

window.addEventListener("load", function() { doR72(); doFreq(); });
</script>
