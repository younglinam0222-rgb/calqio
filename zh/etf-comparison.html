            style="padding:7px 14px;border-radius:20px;border:1px solid var(--accent);
                   background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer">再投资</div>

            style="padding:7px 14px;border-radius:20px;border:1px solid var(--border);

bsp;单利vs复利</div></a><a href="concept" style="background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px;text-decoration:none;display:block"><div style="font-size:12px;font-weight:700;color:var(--text)">💡&nbsp;概念</div></a><a href="ai-investment" style="background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px;text-decoration:none;display:block"><div style="font-size:12px;font-weight:700;color:var(--text)">🤖&nbsp;AI分析</div></a></div></div>

<script>
function toggleMenu(){document.getElementById("lBtn").classList.toggle("open");document.getElementById("lDrop").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest(".lw")){var b=document.getElementById("lBtn"),d=document.getElementById("lDrop");if(b)b.classList.remove("open");if(d)d.classList.remove("open");}});
</script>
<script>
function fmtV(n){if(n>=100000000)return "¥"+(n/100000000).toFixed(2)+"亿";if(n>=10000)return "¥"+Math.round(n/10000)+"万";return "¥"+Math.round(n).toLocaleString();}
// ETF 데이터
var ETFS = [
  {key:"QQQ",  name:"QQQ",  desc:"NASDAQ-100",      color:"#5b7fee", r:{"2015":[100,107,133,128,183,261,346,233,324,440],"2018":[100,71,118,157,210,141,197,264,270],"2020":[100,131,174,117,163,221,226],"2022":[100,152,155,211,216]}},
  {key:"TQQQ", name:"TQQQ", desc:"QQQ 3x Leverage", color:"#ef4444", r:{"2015":[100,108,195,128,317,698,1198,396,896,1600],"2018":[100,39,87,179,258,89,202,362,370],"2020":[100,185,286,96,151,223,228],"2022":[100,211,215,293,300]}},
  {key:"SCHD", name:"SCHD", desc:"Dividend Growth",  color:"#22c55e", r:{"2015":[100,116,134,124,156,166,207,200,203,181],"2018":[100,80,104,131,133,133,134,119],"2020":[100,126,127,128,114,115],"2022":[100,101,90,91,91]}},
  {key:"VOO",  name:"VOO",  desc:"S&P 500",          color:"#f59e0b", r:{"2015":[100,112,137,130,171,201,261,214,271,289],"2018":[100,76,100,133,157,125,158,211,216],"2020":[100,128,161,128,162,207,211],"2022":[100,127,130,177,180]}}
];

var selected = {"QQQ":true,"TQQQ":true,"SCHD":true,"VOO":true};
var reinvest = true;
var myChart = null;

function setAmt(v) { document.getElementById("etfAmt").value = v; go(); }

function setRe(v) {
  reinvest = v;
  var on  = "padding:7px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer";
  var off = "padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text-sub);font-size:12px;font-weight:600;cursor:pointer";
  document.getElementById("btnRe").style.cssText = v ? on : off;
  document.getElementById("btnNo").style.cssText = v ? off : on;
  go();
}

// 칩 토글: 버튼의 dataset.key 사용 → 문자열 전달 없음
function toggleChip(btn) {
  var k = btn.dataset.key;
  selected[k] = !selected[k];
  renderChips();
  go();
}

function renderChips() {
  var area = document.getElementById("chipArea");
  var btns = ETFS.map(function(e) {
    var on = selected[e.key];
    var bg  = on ? e.color : "var(--bg2)";
    var bdr = on ? e.color : "var(--border)";
    var clr = on ? "#fff"  : "var(--text-sub)";
    // onclick="toggleChip(this)" → this = 버튼 자체, dataset.key로 키 전달
    return "<button data-key=\"" + e.key + "\" onclick=\"toggleChip(this)\" "
         + "style=\"display:inline-flex;align-items:center;gap:5px;"
         + "padding:6px 12px;border-radius:16px;border:1.5px solid " + bdr + ";"
         + "background:" + bg + ";color:" + clr + ";"
         + "cursor:pointer;font-size:12px;font-weight:600;"
         + "font-family:inherit;margin:2px;\">"
         + "<span style=\"width:7px;height:7px;border-radius:50%;background:" + e.color + ";display:inline-block\"></span>"
         + e.name + "</button>";
  });
  area.innerHTML = btns.join("");
}

function go() {
  var init = parseFloat(document.getElementById("etfAmt").value) || 1000000;
  var sy   = document.getElementById("etfYear").value;
  var isDark = !document.body.classList.contains("light-mode");
  var tc = isDark ? "#8888a0" : "#555";
  var gc = isDark ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.04)";

  var datasets = [];
  var cards    = [];

  ETFS.forEach(function(e) {
    if (!selected[e.key]) return;
    var raw  = e.r[sy] || e.r["2015"] || [];
    var data = raw.map(function(v) { return Math.round(init * v / 100); });
    datasets.push({
      label: e.name,
      data: data,
      borderColor: e.color,
      backgroundColor: e.color + "20",
      fill: false,
      tension: 0.4,
      borderWidth: 2.5,
      pointRadius: 3,
      pointHoverRadius: 6
    });
    var fin  = data[data.length - 1];
    var rate = ((fin - init) / init * 100).toFixed(0);
    var rclr = fin >= init ? "var(--pos)" : "var(--neg)";
    cards.push(
      "<div style=\"background:var(--card);border:1px solid var(--border);"
      + "border-top:3px solid " + e.color + ";border-radius:var(--radius);padding:14px;\">"
      + "<div style=\"font-size:11px;font-weight:700;color:var(--text-sub)\">" + e.name + "</div>"
      + "<div style=\"font-size:10px;color:var(--text-muted);margin-bottom:8px\">" + e.desc + "</div>"
      + "<div style=\"font-size:18px;font-weight:800;font-family:monospace;color:" + e.color + "\">" + fmtV(fin) + "</div>"
      + "<div style=\"font-size:12px;font-weight:700;color:" + rclr + "\">" + (fin >= init ? "+" : "") + rate + "%</div>"
      + "</div>"
    );
  });

  document.getElementById("cardArea").innerHTML = cards.join("");

  // 라벨
  var firstSelected = ETFS.find(function(e) { return selected[e.key]; });
  var raw0 = firstSelected ? (firstSelected.r[sy] || firstSelected.r["2015"] || []) : [];
  var labels = raw0.map(function(_, i) { return String(parseInt(sy) + i); });

  if (myChart) myChart.destroy();
  var ctx = document.getElementById("etfCanvas").getContext("2d");
  myChart = new Chart(ctx, {
    type: "line",
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: tc, font: { size: 11 } } },
        tooltip: { callbacks: { label: function(c) { return " " + c.dataset.label + ": " + fmtV(c.parsed.y); } } }
      },
      scales: {
        x: { ticks: { color: tc, font: { size: 10 } }, grid: { color: gc } },
        y: { ticks: { color: tc, font: { size: 10 } }, grid: { color: gc } }
      }
    }
  });
}

window.addEventListener("load", function() {
  renderChips();
  go();
});
</script>
</body>
