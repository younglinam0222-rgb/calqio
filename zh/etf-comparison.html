</head>
<body><nav>
  <a href="/zh/" class="logo">Calq<span>io</span></a>
  <button id="theme-btn" class="theme-btn" onclick="toggleTheme()">🌙 深色</button>
  <div class="lw">
    <button class="lc" id="lBtn" onclick="toggleMenu()">
      <span class="fl">🇨🇳</span><span>中文</span><span class="arr">▼</span>
    </button>
    <div class="ld" id="lDrop"><div class="lo" onclick="location.href='/ko/'"><span class="fl">🇰🇷</span>한국어</div><div class="lo" onclick="location.href='/en/'"><span class="fl">🇺🇸</span>English</div><div class="lo" onclick="location.href='/ja/'"><span class="fl">🇯🇵</span>日本語</div><div class="lo active" onclick="location.href='/zh/'"><span class="fl">🇨🇳</span>中文</div><div class="lo" onclick="location.href='/ar/'"><span class="fl">🇸🇦</span>العربية</div></div>
  </div>
</nav>
<div style="max-width:880px;margin:0 auto;padding:24px 18px 14px;text-align:center">
  <h1 style="font-size:clamp(20px,4vw,32px);font-weight:800;letter-spacing:-1px;margin-bottom:8px">
    ETF收益对比<br><em style="color:var(--accent);font-style:normal">10年模拟</em>
  </h1>
  <p style="color:var(--text-sub);font-size:13px">输入投资金额，实时对比主要ETF的增长情况。</p>
</div>
<div style="max-width:880px;margin:0 auto;padding:0 18px 60px">
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
      <div style="flex:1;min-width:130px">
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">💰 投资金额</div>
        <input type="number" id="initA" value="1000000" oninput="go()" style="width:100%;padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;outline:none;font-family:monospace">
        <div class="qbtns" style="margin-top:5px"><button class="qb" onclick="setAmt(100000)">10万</button><button class="qb" onclick="setAmt(500000)">50万</button><button class="qb" onclick="setAmt(1000000)">100万</button><button class="qb" onclick="setAmt(5000000)">500万</button></div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">📅 开始年份</div>
        <select id="sYear" onchange="go()" style="padding:9px 11px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none">
          <option value="2015">2015</option>
          <option value="2018">2018</option>
          <option value="2020">2020</option>
          <option value="2022">2022</option>
        </select>
      </div>
      <div>
        <div style="font-size:10px;color:var(--text-sub);font-weight:600;text-transform:uppercase;margin-bottom:5px">🔄 股息处理</div>
        <div style="display:flex;gap:4px">
          <div id="re0" onclick="setReinvest(true)" style="padding:7px 12px;border-radius:20px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer">再投资</div>
          <div id="re1" onclick="setReinvest(false)" style="padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text-sub);font-size:12px;font-weight:600;cursor:pointer">领取</div>
        </div>
      </div>
    </div>
    <div id="chips" style="display:flex;flex-wrap:wrap;gap:4px"></div>
  </div>
  <div id="cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px"></div>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px">
    <div style="font-size:12px;font-weight:700;margin-bottom:10px">📈 资产增长趋势</div>
    <canvas id="etfChart" height="240"></canvas>
    <div style="font-size:10px;color:var(--text-muted);margin-top:6px">※ 基于历史收益的模拟数据，不代表未来收益。</div>
  </div>
</div>
<footer>
  <div>提升您的金融智商 — 8种金融计算工具</div>

    <a href="/about.html">关于</a>
    <a href="/privacy.html">隐私政策</a>

<div id="toast"></div>
<script src="../common.js"></script>
<script>
function toggleMenu(){document.getElementById("lBtn").classList.toggle("open");document.getElementById("lDrop").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest(".lw")){var b=document.getElementById("lBtn");var d=document.getElementById("lDrop");if(b)b.classList.remove("open");if(d)d.classList.remove("open");}});
</script><script>
var ETF={
  QQQ:{n:"QQQ",d:"NASDAQ-100",c:"#5b7fee",r:{"2015":[100,107,133,128,183,261,346,233,324,440],"2018":[100,71,118,157,210,141,197,264,270],"2020":[100,131,174,117,163,221,226],"2022":[100,152,155,211,216]}},
  TQQQ:{n:"TQQQ",d:"QQQ 3x Leverage",c:"#ef4444",r:{"2015":[100,108,195,128,317,698,1198,396,896,1600],"2018":[100,39,87,179,258,89,202,362,370],"2020":[100,185,286,96,151,223,228],"2022":[100,211,215,293,300]}},
  SCHD:{n:"SCHD",d:"Dividend Growth",c:"#22c55e",r:{"2015":[100,116,134,124,156,166,207,200,203,181],"2018":[100,80,104,131,133,133,134,119],"2020":[100,126,127,128,114,115],"2022":[100,101,90,91,91]}},
  VOO:{n:"VOO",d:"S&P 500",c:"#f59e0b",r:{"2015":[100,112,137,130,171,201,261,214,271,289],"2018":[100,76,100,133,157,125,158,211,216],"2020":[100,128,161,128,162,207,211],"2022":[100,127,130,177,180]}}
};
function fmtV(n){if(n>=100000000)return "¥"+(n/100000000).toFixed(2)+"亿";if(n>=10000)return "¥"+Math.round(n/10000)+"万";return "¥"+Math.round(n).toLocaleString();}
var sel=["QQQ","TQQQ","SCHD","VOO"], reinvest=true, myChart=null;

function setAmt(v){ document.getElementById("initA").value=v; go(); }

function setReinvest(v){
  reinvest=v;
  var r0=document.getElementById("re0"), r1=document.getElementById("re1");
  r0.style.background=v?"var(--accent)":"var(--bg2)";
  r0.style.color=v?"#fff":"var(--text-sub)";
  r0.style.borderColor=v?"var(--accent)":"var(--border)";
  r1.style.background=!v?"var(--accent)":"var(--bg2)";
  r1.style.color=!v?"#fff":"var(--text-sub)";
  r1.style.borderColor=!v?"var(--accent)":"var(--border)";
  go();
}

function toggleChip(k){
  var i=sel.indexOf(k);
  if(i>=0) sel.splice(i,1); else sel.push(k);
  renderChips();
  go();
}

function renderChips(){
  var html="";
  Object.keys(ETF).forEach(function(k){
    var e=ETF[k], on=sel.indexOf(k)>=0;
    html+='<span onclick="toggleChip(\"'+k+'\")" style="';
    html+='display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:16px;';
    html+='border:1.5px solid '+(on?e.c:"var(--border)")+';';
    html+='background:'+(on?e.c:"var(--bg2)")+';';
    html+='color:'+(on?"#fff":"var(--text-sub)")+';';
    html+='cursor:pointer;font-size:12px;font-weight:600;margin:2px;">';
    html+='<span style="width:7px;height:7px;border-radius:50%;background:'+e.c+'"></span>';
    html+=k+'</span>';
  });
  document.getElementById("chips").innerHTML=html;
}

function go(){
  var init=+document.getElementById("initA").value||1000000;
  var sy=document.getElementById("sYear").value;
  var datasets=[], cards="";
  sel.forEach(function(k){
    var e=ETF[k]; if(!e) return;
    var raw=e.r[sy]||e.r["2015"]||[];
    var data=raw.map(function(v){ return Math.round(init*v/100); });
    datasets.push({label:e.n,data:data,borderColor:e.c,backgroundColor:e.c+"20",fill:false,tension:0.4,borderWidth:2.5,pointRadius:3,pointHoverRadius:6});
    var fin=data[data.length-1];
    var rate=((fin-init)/init*100).toFixed(0);
    var clr=fin>=init?"var(--pos)":"var(--neg)";
    cards+='<div style="background:var(--card);border:1px solid var(--border);border-top:3px solid '+e.c+';border-radius:var(--radius);padding:14px">';
    cards+='<div style="font-size:11px;font-weight:700;color:var(--text-sub)">'+e.n+'</div>';
    cards+='<div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">'+e.d+'</div>';
    cards+='<div style="font-size:18px;font-weight:800;font-family:monospace;color:'+e.c+'">'+fmtV(fin)+'</div>';
    cards+='<div style="font-size:12px;font-weight:700;color:'+clr+'">'+(fin>=init?"+":"")+rate+'%</div></div>';
  });
  document.getElementById("cards").innerHTML=cards;
  var firstKey=sel[0], raw0=(ETF[firstKey]||{r:{}}).r[sy]||(ETF[firstKey]||{r:{}}).r["2015"]||[];
  var labels=raw0.map(function(_,i){ return String(+sy+i); });
  var isDark=!document.body.classList.contains("light-mode");
  var gc=isDark?"rgba(255,255,255,0.04)":"rgba(0,0,0,0.04)";
  var tc=isDark?"#8888a0":"#555";
  if(myChart) myChart.destroy();
  var ctx=document.getElementById("etfChart").getContext("2d");
  myChart=new Chart(ctx,{
    type:"line",
    data:{labels:labels,datasets:datasets},
    options:{
      responsive:true,
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{labels:{color:tc,font:{size:11}}},
        tooltip:{callbacks:{label:function(c){return " "+c.dataset.label+": "+fmtV(c.parsed.y);}}}
      },
      scales:{
        x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},
        y:{ticks:{color:tc,font:{size:10}},grid:{color:gc}}
      }
    }
  });
}
renderChips();
go();

</script>
</body>
</html>
